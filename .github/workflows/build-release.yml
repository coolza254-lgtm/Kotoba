name: Build and Release Kotoba APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK (signed with fixed Kotoba key)
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Output
        id: prepare_apk
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          TARGET_APK="dist/Kotoba-${VERSION}-arm64.apk"
          cp "$APK_PATH" "$TARGET_APK"
          echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kotoba-APK
          path: ${{ steps.prepare_apk.outputs.apk_path }}

      # Only version tags (v1.2.0, v1.3.0 ...) become public releases that the in-app updater sees.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ steps.prepare_apk.outputs.version }}
          name: Kotoba ${{ steps.prepare_apk.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          draft: false
          prerelease: false
          make_latest: true
