name: Build and Release Kotoba APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Output
        id: prepare_apk
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [[ "$VERSION" == *"main"* ]]; then
            VERSION="${{ github.event.inputs.release_version }}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="v1.0.0"
          fi
          
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          TARGET_APK="dist/Kotoba-${VERSION}-arm64.apk"
          cp "$APK_PATH" "$TARGET_APK"
          
          echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kotoba-APK
          path: ${{ steps.prepare_apk.outputs.apk_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.prepare_apk.outputs.version }}
          name: Kotoba ${{ steps.prepare_apk.outputs.version }}
          body: |
            ### Kotoba (ことば) - Release ${{ steps.prepare_apk.outputs.version }}
            
            #### มีอะไรใหม่ในรุ่นนี้:
            - รวมคลังคำศัพท์ JLPT N5 และ JLPT N4 พร้อมเครื่องหมายบอกระดับเสียง Pitch Accent (โตเกียว)
            - ระบบ Furigana แบบ Baseline-Aligned หมดปัญหาตัวคานะลอยทับตัวคันจิ
            - โหมดเรียนไวยากรณ์ (Grammar Mode) ครอบคลุมพื้นฐานผันรูปกริยา, N5, N4 พร้อมโครงสร้างและแบบฝึกหัด
            - อัลกอริทึมทบทวนความจำระยะยาว FSRS-5 (Free Spaced Repetition Scheduler)
            - รองรับระบบ In-App Updater อัปเดต APK อัตโนมัติจากในตัวแอป
            
            #### การติดตั้งบน Samsung Galaxy A54 5G:
            1. ดาวน์โหลดไฟล์ `Kotoba-${{ steps.prepare_apk.outputs.version }}-arm64.apk`
            2. แตะเปิดไฟล์เพื่อติดตั้ง (อนุญาต Install Unknown Apps หากระบบร้องขอ)
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          draft: false
          prerelease: false
